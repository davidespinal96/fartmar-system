name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      production_approval:
        description: Ejecutar el despliegue simulado a producción (requiere aprobación del environment)
        type: boolean
        required: true
        default: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fartmar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fartmar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: fartmar_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: 'pdo_pgsql, pcntl'
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: vendor/bin/pint --test && vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G && php artisan test
        working-directory: backend
  images:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
            file: ./backend/Dockerfile
          - component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
  staging:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - run: echo "Simulated staging deployment for commit $GITHUB_SHA"
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production_approval
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - run: echo "Simulated production deployment approved for commit $GITHUB_SHA"
