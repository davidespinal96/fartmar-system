services:
  db:
    image: postgres:16
    container_name: fartmar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fartmar}
      POSTGRES_USER: ${DB_USERNAME:-fartmar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-fartmar_user} -d ${DB_DATABASE:-fartmar}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fartmar-backend
    restart: unless-stopped
    environment:
      APP_NAME: FARTMAR
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env con una clave de 32 bytes codificada en base64}
      APP_URL: http://localhost:8001
      INVENTORY_ASSISTANT_PROVIDER: ${INVENTORY_ASSISTANT_PROVIDER:-mock}
      INVENTORY_ASSISTANT_API_KEY: ${INVENTORY_ASSISTANT_API_KEY:-}
      INVENTORY_ASSISTANT_MODEL: ${INVENTORY_ASSISTANT_MODEL:-gpt-4o-mini}
      INVENTORY_ASSISTANT_BASE_URL: ${INVENTORY_ASSISTANT_BASE_URL:-https://api.openai.com/v1}
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fartmar}
      DB_USERNAME: ${DB_USERNAME:-fartmar_user}
      DB_PASSWORD: ${DB_PASSWORD:?Debes definir DB_PASSWORD en el archivo .env}
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: fartmar-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8080"
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fartmar-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
